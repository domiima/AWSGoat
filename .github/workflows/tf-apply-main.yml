name: 'Terraform Apply'

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: "Select which module to deploy"
        options:
          - module-1
          - module-2
        required: true

permissions: write-all

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.5

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Set Account ID
        id: account
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          cd "modules/${{ github.event.inputs.module }}"
          terraform init -reconfigure \
            -backend-config="bucket=tfstate-awsgoat-${{ env.ACCOUNT_ID }}" \
            -backend-config="key=${{ github.event.inputs.module }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks"

      - name: Terraform Validate
        run: |
          cd "modules/${{ github.event.inputs.module }}"
          terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: 3

      - name: install
        run: |
          pip install boto3

      - name: Terraform Plan
        id: plan
        run: |
          cd "modules/${{ github.event.inputs.module }}"
          terraform plan -input=false

      - name: Terraform Apply
        run: |
          cd "modules/${{ github.event.inputs.module }}"
          terraform apply -auto-approve -input=false

      - name: Terraform Outputs (all)
        run: |
          cd "modules/${{ github.event.inputs.module }}"
          terraform output || true

      - name: Application URL (raw)
        run: |
          cd "modules/${{ github.event.inputs.module }}"
          echo "WEB_APP_URL=$(terraform output -raw ad_Target_URL)" >> $GITHUB_ENV
          echo "Web app URL: $(terraform output -raw ad_Target_URL)"

      - name: Write URL to Job Summary
        run: |
          echo "## AWSGoat Web App URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.WEB_APP_URL }}\`" >> $GITHUB_STEP_SUMMARY
