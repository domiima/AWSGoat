name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: "Select which module to deploy"
        options:
          - module-1
          - module-2
        required: true

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Installa Terraform nel runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # ✅ Check: verifica che i secrets ESISTANO (senza stamparli)
      - name: Check secrets are present (length only)
        shell: bash
        env:
          AKID: ${{ secrets.ACCESS_KEY_ID }}
          SAK:  ${{ secrets.SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AKID" ]; then echo "Missing secret: ACCESS_KEY_ID" && exit 1; fi
          if [ -z "$SAK"  ]; then echo "Missing secret: SECRET_ACCESS_KEY" && exit 1; fi
          echo "ACCESS_KEY_ID length: ${#AKID}"
          echo "SECRET_ACCESS_KEY length: ${#SAK}"

      # ✅ Configura credenziali AWS nel runner (export automatico delle env var standard)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # (debug utile) Mostra la versione di terraform e verifica AWS identity (non stampa segreti)
      - name: Debug tools and identity
        shell: bash
        run: |
          terraform -version
          aws --version
          aws sts get-caller-identity

      - name: Terraform Init
        working-directory: modules/${{ github.event.inputs.module }}
        run: terraform init -upgrade

      - name: Terraform Validate
        working-directory: modules/${{ github.event.inputs.module }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: modules/${{ github.event.inputs.module }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: modules/${{ github.event.inputs.module }}
        run: terraform apply -auto-approve

      - name: Terraform Outputs
        working-directory: modules/${{ github.event.inputs.module }}
        run: terraform output
