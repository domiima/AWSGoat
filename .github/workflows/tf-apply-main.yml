name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: "Select which module to deploy"
        options:
          - module-1
          - module-2
        required: true

permissions:
  contents: read

# Evita 2 apply contemporanei sullo stesso modulo
concurrency:
  group: terraform-${{ github.event.inputs.module }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check secrets are present (length only)
        shell: bash
        env:
          AKID: ${{ secrets.ACCESS_KEY_ID }}
          SAK:  ${{ secrets.SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AKID" ]; then echo "Missing secret: ACCESS_KEY_ID" && exit 1; fi
          if [ -z "$SAK"  ]; then echo "Missing secret: SECRET_ACCESS_KEY" && exit 1; fi
          echo "ACCESS_KEY_ID length: ${#AKID}"
          echo "SECRET_ACCESS_KEY length: ${#SAK}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Debug tools and identity
        shell: bash
        run: |
          terraform -version
          aws --version
          aws sts get-caller-identity

      # ✅ IMPORTANTISSIMO: init con REMOTE STATE su S3 (persistente)
      - name: Terraform Init (REMOTE STATE)
        working-directory: modules/${{ github.event.inputs.module }}
        shell: bash
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=do-not-delete-awsgoat-state-files-220551387025" \
            -backend-config="key=${{ github.event.inputs.module }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-locks"

      - name: Terraform Validate
        working-directory: modules/${{ github.event.inputs.module }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: modules/${{ github.event.inputs.module }}
        shell: bash
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: modules/${{ github.event.inputs.module }}
        shell: bash
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        working-directory: modules/${{ github.event.inputs.module }}
        run: terraform output
