name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: "Select which module to deploy"
        options:
          - module-1
          - module-2
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.inputs.module }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check secrets are present (length only)
        shell: bash
        env:
          AKID: ${{ secrets.ACCESS_KEY_ID }}
          SAK:  ${{ secrets.SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AKID" ]; then echo "Missing secret: ACCESS_KEY_ID" && exit 1; fi
          if [ -z "$SAK"  ]; then echo "Missing secret: SECRET_ACCESS_KEY" && exit 1; fi
          echo "ACCESS_KEY_ID length: ${#AKID}"
          echo "SECRET_ACCESS_KEY length: ${#SAK}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Debug tools and identity
        shell: bash
        run: |
          terraform -version
          aws --version
          aws sts get-caller-identity

      - name: Ensure DynamoDB lock table exists
        shell: bash
        run: |
          set -e
          TABLE="terraform-locks"
          REGION="us-east-1"

          if aws dynamodb describe-table --table-name "$TABLE" --region "$REGION" >/dev/null 2>&1; then
            echo "DynamoDB table '$TABLE' already exists."
          else
            echo "Creating DynamoDB table '$TABLE'..."
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            echo "Waiting for table to become ACTIVE..."
            aws dynamodb wait table-exists --table-name "$TABLE" --region "$REGION"
            echo "DynamoDB table '$TABLE' is ready."
          fi

      - name: Terraform Init (REMOTE STATE)
        working-directory: modules/${{ github.event.inputs.module }}
        shell: bash
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=do-not-delete-awsgoat-state-files-220551387025" \
            -backend-config="key=${{ github.event.inputs.module }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-locks"

      - name: Terraform Validate
        working-directory: modules/${{ github.event.inputs.module }}
        run: terraform validate

      - name: Auto-import existing AWS resources (idempotent)
        working-directory: modules/${{ github.event.inputs.module }}
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "ACCOUNT_ID=$ACCOUNT_ID"

          tf_import_if_missing () {
            local addr="$1"
            local id="$2"
            if terraform state show "$addr" >/dev/null 2>&1; then
              echo "OK: $addr already in state"
            else
              echo "IMPORT: $addr <= $id"
              terraform import -input=false "$addr" "$id" || true
            fi
          }

          # ---------------- IAM ROLES ----------------
          if aws iam get-role --role-name "blog_app_lambda" >/dev/null 2>&1; then
            tf_import_if_missing "aws_iam_role.blog_app_lambda" "blog_app_lambda"
          fi

          if aws iam get-role --role-name "blog_app_lambda_data" >/dev/null 2>&1; then
            tf_import_if_missing "aws_iam_role.blog_app_lambda_python" "blog_app_lambda_data"
          fi

          if aws iam get-role --role-name "AWS_GOAT_ROLE" >/dev/null 2>&1; then
            tf_import_if_missing "aws_iam_role.goat_role" "AWS_GOAT_ROLE"
          fi

          # ---------------- IAM INSTANCE PROFILE ----------------
          if aws iam get-instance-profile --instance-profile-name "AWS_GOAT_ec2_profile" >/dev/null 2>&1; then
            tf_import_if_missing "aws_iam_instance_profile.goat_iam_profile" "AWS_GOAT_ec2_profile"
          fi

          # ---------------- IAM POLICIES ----------------
          POLICY_ARN="$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='lambda-data-policies'].Arn | [0]" --output text)"
          if [ "$POLICY_ARN" != "None" ] && [ -n "$POLICY_ARN" ]; then
            tf_import_if_missing "aws_iam_policy.lambda_data_policies" "$POLICY_ARN"
          fi

          POLICY2_ARN="$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='dev-ec2-lambda-policies'].Arn | [0]" --output text)"
          if [ "$POLICY2_ARN" != "None" ] && [ -n "$POLICY2_ARN" ]; then
            tf_import_if_missing "aws_iam_policy.goat_inline_policy_2" "$POLICY2_ARN"
          fi

          # ---------------- LAMBDA FUNCTIONS ----------------
          if aws lambda get-function --function-name "blog-application-data" >/dev/null 2>&1; then
            tf_import_if_missing "aws_lambda_function.lambda_ba_data" "blog-application-data"
          fi

          if aws lambda get-function --function-name "blog-application" >/dev/null 2>&1; then
            tf_import_if_missing "aws_lambda_function.react_lambda_app" "blog-application"
          fi

          # ---------------- LAMBDA PERMISSIONS ----------------
          if aws lambda get-policy --function-name "blog-application" >/dev/null 2>&1; then
            if aws lambda get-policy --function-name "blog-application" --query 'Policy' --output text | grep -q '"Sid":"AllowAPIGatewayInvoke"'; then
              tf_import_if_missing "aws_lambda_permission.apigw_ba" "blog-application/AllowAPIGatewayInvoke"
            fi
          fi

          if aws lambda get-policy --function-name "blog-application-data" >/dev/null 2>&1; then
            if aws lambda get-policy --function-name "blog-application-data" --query 'Policy' --output text | grep -q '"Sid":"AllowAPIGatewayInvoke"'; then
              tf_import_if_missing "aws_lambda_permission.apigw_ba_python" "blog-application-data/AllowAPIGatewayInvoke"
            fi
          fi

          # ---------------- S3 BUCKETS ----------------
          PROD_BUCKET="production-blog-awsgoat-bucket-${ACCOUNT_ID}"
          DEV_BUCKET="dev-blog-awsgoat-bucket-${ACCOUNT_ID}"
          TEMP_BUCKET="ec2-temp-bucket-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$PROD_BUCKET" >/dev/null 2>&1; then
            tf_import_if_missing "aws_s3_bucket.bucket_upload" "$PROD_BUCKET"
          fi
          if aws s3api head-bucket --bucket "$DEV_BUCKET" >/dev/null 2>&1; then
            tf_import_if_missing "aws_s3_bucket.dev" "$DEV_BUCKET"
          fi
          if aws s3api head-bucket --bucket "$TEMP_BUCKET" >/dev/null 2>&1; then
            tf_import_if_missing "aws_s3_bucket.bucket_temp" "$TEMP_BUCKET"
          fi

          # ---------------- DYNAMODB TABLES ----------------
          if aws dynamodb describe-table --table-name "blog-users" >/dev/null 2>&1; then
            tf_import_if_missing "aws_dynamodb_table.users_table" "blog-users"
          fi
          if aws dynamodb describe-table --table-name "blog-posts" >/dev/null 2>&1; then
            tf_import_if_missing "aws_dynamodb_table.posts_table" "blog-posts"
          fi

          # ---------------- NETWORK (VPC/SUBNET/IGW/SG/RT) ----------------
          # 1) VPC: prendiamo prima quella col tag Name=AWS_GOAT_VPC
          GOAT_VPC_ID="$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=AWS_GOAT_VPC --query "Vpcs[0].VpcId" --output text)"
          if [ "$GOAT_VPC_ID" = "None" ] || [ -z "$GOAT_VPC_ID" ]; then
            GOAT_VPC_ID="$(aws ec2 describe-vpcs --filters Name=cidr,Values=192.168.0.0/16 --query "Vpcs[0].VpcId" --output text)"
          fi
          if [ "$GOAT_VPC_ID" = "None" ] || [ -z "$GOAT_VPC_ID" ]; then
            GOAT_VPC_ID="$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text)"
          fi
          if [ "$GOAT_VPC_ID" != "None" ] && [ -n "$GOAT_VPC_ID" ]; then
            tf_import_if_missing "aws_vpc.goat_vpc" "$GOAT_VPC_ID"
          fi
          echo "GOAT_VPC_ID=$GOAT_VPC_ID"

          # 2) Internet Gateway: importiamo quello ATTACCATO alla VPC (così non prova a crearne uno e non sfora la quota)
          if [ "$GOAT_VPC_ID" != "None" ] && [ -n "$GOAT_VPC_ID" ]; then
            IGW_ID="$(aws ec2 describe-internet-gateways --filters Name=attachment.vpc-id,Values=$GOAT_VPC_ID --query "InternetGateways[0].InternetGatewayId" --output text)"
            if [ "$IGW_ID" != "None" ] && [ -n "$IGW_ID" ]; then
              tf_import_if_missing "aws_internet_gateway.goat_gw" "$IGW_ID"
            fi
          fi

          # 3) Subnet: importiamo quella che già usa 192.168.0.0/24 nella VPC
          if [ "$GOAT_VPC_ID" != "None" ] && [ -n "$GOAT_VPC_ID" ]; then
            SUBNET_ID="$(aws ec2 describe-subnets --filters Name=vpc-id,Values=$GOAT_VPC_ID Name=cidr-block,Values=192.168.0.0/24 --query "Subnets[0].SubnetId" --output text)"
            if [ "$SUBNET_ID" != "None" ] && [ -n "$SUBNET_ID" ]; then
              tf_import_if_missing "aws_subnet.goat_subnet" "$SUBNET_ID"
            fi
          fi

          # 4) Security Group: importiamo quello già esistente con name AWS_GOAT_sg nella VPC
          if [ "$GOAT_VPC_ID" != "None" ] && [ -n "$GOAT_VPC_ID" ]; then
            SG_ID="$(aws ec2 describe-security-groups --filters Name=vpc-id,Values=$GOAT_VPC_ID Name=group-name,Values=AWS_GOAT_sg --query "SecurityGroups[0].GroupId" --output text)"
            if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then
              tf_import_if_missing "aws_security_group.goat_sg" "$SG_ID"
            fi
          fi

          # 5) Route table: importiamo quella che ha la route 0.0.0.0/0 verso IGW
          if [ "$GOAT_VPC_ID" != "None" ] && [ -n "$GOAT_VPC_ID" ]; then
            RT_ID="$(aws ec2 describe-route-tables --filters Name=vpc-id,Values=$GOAT_VPC_ID --query "RouteTables[?Routes[?DestinationCidrBlock=='0.0.0.0/0' && GatewayId!=null]][0].RouteTableId" --output text)"
            if [ "$RT_ID" != "None" ] && [ -n "$RT_ID" ]; then
              tf_import_if_missing "aws_route_table.goat_rt" "$RT_ID"
            fi
          fi

          # 6) Route table association: importiamo l’associazione della subnet alla route table (se esiste)
          if [ "${SUBNET_ID:-}" != "" ] && [ "${SUBNET_ID:-}" != "None" ]; then
            ASSOC_ID="$(aws ec2 describe-route-tables --filters Name=association.subnet-id,Values=$SUBNET_ID --query "RouteTables[0].Associations[0].RouteTableAssociationId" --output text)"
            if [ "$ASSOC_ID" != "None" ] && [ -n "$ASSOC_ID" ]; then
              tf_import_if_missing "aws_route_table_association.goat_public_rta" "$ASSOC_ID"
            fi
          fi

          echo "Auto-import completed."

      - name: Terraform Plan
        working-directory: modules/${{ github.event.inputs.module }}
        shell: bash
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: modules/${{ github.event.inputs.module }}
        shell: bash
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        working-directory: modules/${{ github.event.inputs.module }}
        run: terraform output
